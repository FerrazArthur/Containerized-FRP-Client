services:
  remote-user:
    build:
      context: .
      dockerfile: Dockerfile.remote-user
    command: sleep infinity
    container_name: remote-user
    networks:
      - comms-external

  # Nginx server for managing local traffic and TLS certifications
  nginx-server:
    image: nginx:alpine
    container_name: nginx-server
    volumes:
      - etc-nginx:/etc/nginx
      - ./test-env-config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - comms-nginx
      - comms-external
    depends_on:
      frp-server:
        condition: service_started

  # The basic frp server
  frp-server:
    image: ghcr.io/ferrazarthur/containerized-frp-client:frp-server
    build:
      context: .
      dockerfile: Dockerfile.frps
    container_name: frp-server
    volumes:
      - ./test-env-config/frps.toml:/frp/frps.toml:ro # This allow for quick configuration of the frp server
    networks:
      - comms-nginx

  # My custom application for providing easy configuration for frp with docker
  frp-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frp-client
    environment:
      - FRP_SERVER_IP=frp-server
      - SSHD_SERVER_IP=sshd-server
    tty: true
    stdin_open: true
    volumes:
      - ./test-env-config/frpc.toml:/frp/frpc.toml:ro # This allow for quick configuration of the frp client
    networks:
      - comms-nginx
      - comms-local
    depends_on:
      - frp-server
      - nginx-server

  # Server that provides some tcp application
  sshd-server:
    build:
      context: .
      dockerfile: application/Dockerfile.sshd
    container_name: sshd-server
    volumes:
      - ./test-env-config/sshd_config:/etc/ssh/sshd_config:ro
    environment:
      - LOCAL_SSHD_BIND_IP=${LOCAL_SSHD_BIND_IP}
      - LOCAL_SSHD_BIND_PORT=${LOCAL_SSHD_BIND_PORT}
    networks:
      - comms-local

networks:
  comms-external:
    driver: bridge
  comms-local:
    driver: bridge
  comms-nginx:
    driver: bridge

volumes:
  etc-nginx: